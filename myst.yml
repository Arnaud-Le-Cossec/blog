version: 1
project:
  title: My Blog
  description: A blog about electronics, Hardware architecture, Emulators and open-source software.
  # thumbnail: images/profile-thumbnail.webp
  # authors:
  #   - name: Jane Doe
  #     email: jane.doe@example.com
  #     orcid: 0000-0000-0000-0000
  #     url: https://example.com
  #     affiliations:
  #       - Example University
  copyright: '2026'
  keywords:
    - Blog
    - Electronics
    - Hardware architecture
    - Emulators
    - Open-source Software
  github: arnaud-le-cossec/blog
  exclude:
    - _build
    - Thumbs.db
    - .DS_Store
    - '**.ipynb_checkpoints'
    - generate_rss.py
    - inject_comments.py
    - rss.xml
    - atom.xml
    - fonts/**
    - CONDUCT.md
    - CONTRIBUTING.md
    - README.md
  toc:
    - file: index.md
    - file: about.md
    - file: tags/zephyr-project.md
    - file: contact.md
    - pattern: posts/*.md
      hidden: true
site:
  options:
    logo: logo.png
    logo_dark: logo.png
    favicon: fav.ico
    style: custom.css
    # analytics_google: G-XXXXXXXXXX
    folders: true
  actions:
  template: book-theme
  parts:
    primary_sidebar_footer: ''
    footer: |
      [GitHub](https://github.com/arnaud-le-cossec) |
      [LinkedIn](https://www.linkedin.com/in/arnaud-le-cossec)
